<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1200" height="55" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <rect x="25" y="14" width="26" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" />
  <text x="31" y="32" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">&gt;_</text>
  <text x="60" y="33" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">TELEMETRY<tspan fill="#38bdf8">.PULSE</tspan></text>
  <rect x="220" y="18" width="105" height="20" rx="4" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="228" y="32" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold">10k+ @ 60 FPS</text>
  <rect x="1040" y="15" width="135" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <circle cx="1055" cy="27" r="4" fill="#34d399" />
  <text x="1066" y="31" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">ENGINE RUNNING</text>

  <!-- Filter & Time Bar -->
  <rect x="25" y="70" width="1150" height="55" rx="10" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="45" y="102" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Stream &amp; Filter Controls</text>
  <rect x="260" y="85" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="272" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Server A</text>
  <rect x="350" y="85" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="362" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Server B</text>
  <rect x="440" y="85" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="452" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Server C</text>
  <rect x="530" y="85" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="542" y="102" fill="#94a3b8" font-family="monospace" font-size="11">Server D</text>
  <rect x="850" y="85" width="95" height="26" rx="6" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="862" y="102" fill="#38bdf8" font-family="monospace" font-size="11">⚡ Burst +2k</text>
  <rect x="955" y="85" width="110" height="26" rx="6" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="0.8"/>
  <text x="965" y="102" fill="#c084fc" font-family="monospace" font-size="11">⚡ Server Action</text>
  <rect x="1075" y="85" width="85" height="26" rx="6" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="1088" y="102" fill="#fbbf24" font-family="monospace" font-size="11">⏸ Pause</text>

  <!-- 2x2 Chart Grid -->
  <!-- Chart 1: Line Chart -->
  <rect x="25" y="140" width="565" height="250" rx="12" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="45" y="168" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Time-Series Stream (10,000+ Pts)</text>
  <text x="45" y="184" fill="#64748b" font-family="sans-serif" font-size="10">Live updates • 60 FPS Canvas hybrid • Area gradient</text>
  <!-- Line wave and area -->
  <path d="M 50 340 L 50 300 Q 100 240, 160 270 T 270 230 T 380 280 T 470 210 T 560 250 L 560 340 Z" fill="url(#lineGrad)" />
  <path d="M 50 300 Q 100 240, 160 270 T 270 230 T 380 280 T 470 210 T 560 250" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Anomalies -->
  <circle cx="470" cy="210" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" />

  <!-- Chart 2: Scatter Plot -->
  <rect x="610" y="140" width="565" height="250" rx="12" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="630" y="168" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Scatter Distribution (10,000+ Points)</text>
  <text x="630" y="184" fill="#64748b" font-family="sans-serif" font-size="10">Spatial Grid O(1) Hit-Testing • Anomaly cluster inspection</text>
  <!-- Scatter Dots -->
  <g opacity="0.8">
    <circle cx="650" cy="280" r="3" fill="#38bdf8" />
    <circle cx="670" cy="230" r="3" fill="#10b981" />
    <circle cx="710" cy="310" r="3" fill="#f59e0b" />
    <circle cx="740" cy="250" r="3" fill="#ec4899" />
    <circle cx="780" cy="220" r="3" fill="#38bdf8" />
    <circle cx="820" cy="290" r="3" fill="#10b981" />
    <circle cx="860" cy="240" r="3" fill="#f59e0b" />
    <circle cx="900" cy="210" r="4.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="940" cy="300" r="3" fill="#ec4899" />
    <circle cx="980" cy="270" r="3" fill="#38bdf8" />
    <circle cx="1020" cy="240" r="3" fill="#10b981" />
    <circle cx="1060" cy="260" r="3" fill="#f59e0b" />
    <circle cx="1110" cy="230" r="3" fill="#ec4899" />
  </g>

  <!-- Chart 3: Histogram -->
  <rect x="25" y="405" width="565" height="260" rx="12" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="45" y="433" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Aggregated Bucket Histogram</text>
  <text x="45" y="449" fill="#64748b" font-family="sans-serif" font-size="10">Time period binning (1MIN) • Mean throughput</text>
  <!-- Histogram bars -->
  <rect x="60" y="520" width="22" height="110" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="95" y="490" width="22" height="140" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="130" y="470" width="22" height="160" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="165" y="510" width="22" height="120" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="200" y="460" width="22" height="170" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="235" y="530" width="22" height="100" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="270" y="480" width="22" height="150" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>
  <rect x="305" y="450" width="22" height="180" rx="4" fill="url(#barGrad)" stroke="#34d399" stroke-width="1"/>

  <!-- Chart 4: Heatmap -->
  <rect x="610" y="405" width="565" height="260" rx="12" fill="url(#cardBg)" stroke="#1e293b" />
  <text x="630" y="433" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Time × Node Density Heatmap</text>
  <text x="630" y="449" fill="#64748b" font-family="sans-serif" font-size="10">Temporal matrix binning • Activity heat distribution</text>
  <!-- Heatmap cells -->
  <g transform="translate(680, 480)">
    <rect x="0" y="0" width="30" height="24" rx="2" fill="#1e3a8a" />
    <rect x="35" y="0" width="30" height="24" rx="2" fill="#0284c7" />
    <rect x="70" y="0" width="30" height="24" rx="2" fill="#059669" />
    <rect x="105" y="0" width="30" height="24" rx="2" fill="#f59e0b" />
    <rect x="140" y="0" width="30" height="24" rx="2" fill="#dc2626" />
    <rect x="175" y="0" width="30" height="24" rx="2" fill="#0284c7" />

    <rect x="0" y="30" width="30" height="24" rx="2" fill="#059669" />
    <rect x="35" y="30" width="30" height="24" rx="2" fill="#f59e0b" />
    <rect x="70" y="30" width="30" height="24" rx="2" fill="#dc2626" />
    <rect x="105" y="30" width="30" height="24" rx="2" fill="#0284c7" />
    <rect x="140" y="30" width="30" height="24" rx="2" fill="#1e3a8a" />
    <rect x="175" y="30" width="30" height="24" rx="2" fill="#059669" />

    <rect x="0" y="60" width="30" height="24" rx="2" fill="#f59e0b" />
    <rect x="35" y="60" width="30" height="24" rx="2" fill="#dc2626" />
    <rect x="70" y="60" width="30" height="24" rx="2" fill="#0284c7" />
    <rect x="105" y="60" width="30" height="24" rx="2" fill="#1e3a8a" />
    <rect x="140" y="60" width="30" height="24" rx="2" fill="#059669" />
    <rect x="175" y="60" width="30" height="24" rx="2" fill="#f59e0b" />

    <rect x="0" y="90" width="30" height="24" rx="2" fill="#0284c7" />
    <rect x="35" y="90" width="30" height="24" rx="2" fill="#059669" />
    <rect x="70" y="90" width="30" height="24" rx="2" fill="#f59e0b" />
    <rect x="105" y="90" width="30" height="24" rx="2" fill="#dc2626" />
    <rect x="140" y="90" width="30" height="24" rx="2" fill="#0284c7" />
    <rect x="175" y="90" width="30" height="24" rx="2" fill="#1e3a8a" />
  </g>

  <!-- Performance Monitor HUD floating bottom right -->
  <g transform="translate(860, 520)">
    <rect x="0" y="0" width="300" height="135" rx="14" fill="#030712" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <rect x="0" y="0" width="300" height="30" rx="14" fill="#1e293b" />
    <text x="15" y="20" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">PERFORMANCE HUD</text>
    <rect x="230" y="6" width="58" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="238" y="19" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">60 FPS</text>

    <text x="15" y="55" fill="#94a3b8" font-family="monospace" font-size="10">FRAME TIME: <tspan fill="#38bdf8" font-weight="bold">4.8 ms</tspan></text>
    <text x="150" y="55" fill="#94a3b8" font-family="monospace" font-size="10">HEAP: <tspan fill="#c084fc" font-weight="bold">42.4 MB</tspan></text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="10">INGESTED: <tspan fill="#34d399" font-weight="bold">10,000 pts</tspan></text>
    <text x="150" y="80" fill="#94a3b8" font-family="monospace" font-size="10">LOD: <tspan fill="#f59e0b" font-weight="bold">1,500 pts</tspan></text>

    <rect x="15" y="95" width="85" height="24" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="24" y="111" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="bold">Standard (10k)</text>
    <rect x="108" y="95" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="117" y="111" fill="#94a3b8" font-family="monospace" font-size="9">Heavy (50k)</text>
    <rect x="200" y="95" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="207" y="111" fill="#94a3b8" font-family="monospace" font-size="9">Extreme (100k)</text>
  </g>
</svg>
